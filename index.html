 <!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171936">
  <link rel="manifest" href="./manifest.json">
  <title>Жаргалант 40-р төгсөлт</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 16px 40px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(145deg, #101b35, #25234D, #34305F);
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      text-align: center;
    }

    .logo {
      width: 145px;
      height: 145px;
      object-fit: contain;
      margin: 10px auto 15px;
    }

    h1 {
      font-size: 25px;
      margin: 10px 0 28px;
      color: #ffffff;
    }

    .banner {
      display: block;
      text-decoration: none;
      color: white;
      padding: 25px 20px;
      margin: 18px 0;
      border-radius: 20px;
      text-align: left;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    .volleyball {
      background: linear-gradient(135deg, #173f35, #245c4b);
      border: 1px solid #D8B653;
    }

    .anniversary {
      background: linear-gradient(135deg, #25234D, #51447C);
      border: 1px solid #A9D9FF;
    }

    .banner h2 {
      margin: 0 0 12px;
      font-size: 22px;
      line-height: 1.4;
    }

    .banner p {
      margin: 8px 0;
      font-size: 15px;
      line-height: 1.5;
      color: #E8EAF6;
    }

    .volleyball h2 {
      color: #E5C36B;
    }

    .anniversary h2 {
      color: #A9D9FF;
    }

    .arrow {
      display: inline-block;
      margin-top: 15px;
      padding: 11px 18px;
      border-radius: 25px;
      background: #D8B653;
      color: #17213B;
      font-weight: bold;
      font-size: 14px;
    }

    .anniversary .arrow {
      background: #A9D9FF;
      color: #171936;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      letter-spacing: 1px;
      color: #A9D9FF;
    }
  </style>
</head>

<body>
  <main class="container">

    <img class="logo"
      src="./Жаргалант%2040%20Volleyball%20Emblem.png"
      alt="Жаргалант 40 лого">

    <h1>ЖАРГАЛАНТ 40-Р ТӨГСӨЛТ</h1>

    <a class="banner volleyball"
       href="https://my-volleyball-score.streamlit.app/">
      <h2>🏐 ВОЛЕЙБОЛЫН БҮРТГЭЛИЙН АПП</h2>
      <p>Тоглолтын оноо, статистик, багийн бүртгэл</p>
      <span class="arrow">АПП НЭЭХ →</span>
    </a>

    <a class="banner anniversary" href="./20years.html">
      <h2>✨ 20 ЖИЛИЙН УУЛЗАЛТ</h2>
      <p>1997 — 2007</p>
      <p>Ойн хүрээнд зохион байгуулагдах хөтөлбөрүүд</p>
      <span class="arrow">ХӨТӨЛБӨР ҮЗЭХ →</span>
    </a>

    <p class="footer">ЖАРГАЛАНТ 40-Р ТӨГСӨЛТ · 2027</p>

  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>
</body>
</html>
